[project]
name = "ricl-experiment"
version = "0.1.0"
description = "Reproducible experiments for the RiCL Motivation Study"
readme = "README.md"
authors = [
    { name = "RUSS0718", email = "3534543332@qq.com" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=4,<5",
    "httpx>=0.28,<1",
    "matplotlib>=3.10,<4",
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "pydantic>=2,<3",
    "scipy>=1.15,<2",
    "sympy>=1.13,<2",
]

[project.scripts]
ricl-experiment = "ricl_experiment.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.10,<1",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

